name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The e2e suite runs against the demo build (DEMO_MODE=true, no database —
      # playwright.config.ts loads .env.demo), so CI needs no Postgres, seed, or
      # DB secrets. Real-auth tests skip themselves in demo mode.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
