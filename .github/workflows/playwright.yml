name: Playwright Tests

on:
  pull_request:
    # claude/db-persistence-changes is included so a PR stacked on top of it
    # (rather than on main) still gets real CI, not just local verification.
    # Remove that entry once that branch merges to main and no PR targets it
    # directly anymore.
    branches: [main, claude/db-persistence-changes]
  push:
    branches: [main, claude/db-persistence-changes]

jobs:
  # Unit tests: pure logic (e.g. src/lib/server/scoring.ts), no browser or DB needed.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:unit

  # Demo mode: no database. playwright.config.ts loads .env.demo (DEMO_MODE=true)
  # because DATABASE_URL is unset, so the build + preview run entirely in-memory.
  # The real-auth tests skip themselves in demo mode.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Database mode: real Postgres + seed. DATABASE_URL is set, so the config skips
  # .env.demo and the app runs against the database with real auth (the login /
  # sign-out tests run here).
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: local
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://root:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/local
      ORIGIN: http://localhost:4173
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      # Points at the production LD environment on purpose: the login /
      # matchmake tests that run here still identify real subjects against
      # `social-matchmake-cta`. Stored as a secret (it's a client-side ID, so
      # not actually sensitive -- a repo variable would do just as well and
      # would show unmasked in logs). If it's unset, initLD() silently no-ops
      # and the job still passes -- so a green run is not on its own proof
      # that traffic was sent.
      #
      # The bulk traffic generator (e2e/traffic/matchmake-random-users.e2e.ts,
      # 25 accounts, tagged @traffic) is excluded by `npm run test:e2e`
      # itself (see package.json's --grep-invert @traffic), so it doesn't run
      # here on every push/PR -- run it deliberately with
      # `npm run test:e2e:traffic`.
      PUBLIC_LD_CLIENT_ID: ${{ secrets.PUBLIC_LD_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
